<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablette</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="root" hidden>
  <div class="device" role="dialog" aria-modal="true" aria-label="Tablette du U.S. Marshals Service">
    <div class="bar">
      <span class="brand">U.S. Marshals Service</span>
      <span class="clock" id="clock" aria-hidden="true"></span>
      <button id="close" type="button" aria-label="Ranger la tablette" title="Ranger la tablette (Échap)">✕</button>
    </div>
    <div class="screen">
      <iframe id="app" title="Console du service" allow="clipboard-read; clipboard-write"></iframe>
      <pre id="debug" hidden></pre>
      <div id="overlay" role="status">
        <p id="msg">Connexion à la console…</p>
        <button id="retry" type="button" hidden>Réessayer</button>
      </div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
