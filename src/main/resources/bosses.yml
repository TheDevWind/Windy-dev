# ==========================================================
#  Boss de clan : un boss par niveau de clan.
#  Après une victoire, le boss se reforme au bout de "win-cooldown" secondes (1 h).
#  Menu du clan > Boss. Le combat a lieu dans une arène (monde "windy_arenes").
#
#  MAJ équilibrage (29/09) : PV x2 à x3, dégâts +1/+2, runes plus rares
#  (25 % -> 15 %), XP de clan -25 %, cooldown 30 min -> 1 h.
#  MAJ donjons (1.10.0) : le boss 5 lâche le Sceau des Mines englouties,
#  le boss 8 celui de la Citadelle de givre.
#  MAJ gravure (1.12.0) : les boss 3 à 10 lâchent un Glyphe runique II.
#
#  type        : type de mob Minecraft
#  health      : points de vie (20 = 10 coeurs)
#  damage      : dégâts par coup
#  speed       : vitesse (0.23 = zombie normal)
#  scale       : taille (1 = normale, 2 = double)
#  effects     : effets permanents  EFFET:niveau (0 = niveau I)
#  equipment   : hand, helmet, chestplate, leggings, boots
#  abilities   : summon (mob, count), lightning, fireball, leap, shockwave, teleport, slow, heal
#                cooldown en secondes
#  rewards     : rune       = rune lâchée (une seule)
#                rune-chance = chance en % d'avoir la rune
#                clan-xp    = XP de clan (toujours donnée)
#                items      = (optionnel) objets toujours lâchés : windy:<id>:n ou MATÉRIAU:n
# ==========================================================
config-version: 3

settings:
  # grade minimum pour lancer un combat
  rank: OFFICIER
  # secondes pour rejoindre le combat après le lancement
  lobby-seconds: 20
  # durée max du combat (secondes)
  time-limit: 600
  # attente avant de retenter après une défaite (secondes)
  retry-cooldown: 300
  # attente avant de refaire un boss déjà vaincu (secondes) : 3600 = 1 h
  win-cooldown: 3600
  # PV du boss x (1 + group-scaling x (joueurs - 1)) : 0.5 = +50 % par joueur en plus
  group-scaling: 0.5

