# ==========================================================================================
#  WindyClans - Arbres de compétences et évolutions de race
# ------------------------------------------------------------------------------------------
#  Chaque race a 3 branches (offensive, def, sig) de 5 passifs. Le passif n°k se débloque au rang k.
#  Un passif : {name, icon, stat, per-level, max (5), cost (1 point par niveau), when (condition)}
#  Conditions possibles : night, water, water-or-rain, nether, underground, forest, altitude,
#                         low-health, axe
#  Branches : offensive, def (défense), sig (signature). Les 4 compétences spéciales (extra, unique, unique-plus, ultimate) sont codées dans le plugin ;
#  ici on règle leurs textes, coûts et recharges.
# ==========================================================================================
config-version: 1

settings:
  points-per-level: 1
  points-per-awakening: 3
  costs: {extra: 5, unique: 10, unique-plus: 10, ultimate: 20}
  # objet qui rend tous les points (id windy: de items.yml)
  reset-item: "windy:parchemin_oubli"

