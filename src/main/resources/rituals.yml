# ==========================================================
#  Rituels
#
#  AUTEL
#   Tier I   : une table d'enchantement au centre + 4 blocs d'améthyste
#              à 3 blocs du centre (nord, sud, est, ouest), à la même hauteur.
#   Tier II  : + 4 obsidiennes pleureuses aux coins (3 blocs en diagonale de la table)
#   Tier III : + un bloc de diamant sous la table
#   Un autel complet prend une apparence spéciale (pack de ressources).
#
#  AUTEL INFUSÉ (MAJ 1.9.0)
#   Les 4 blocs d'améthyste doivent être de l'AMÉTHYSTE INFUSÉE (infuseur magique),
#   sinon l'autel n'est pas reconnu. Le plus faible tier d'améthyste infusée plafonne
#   le tier de l'autel (ex. 3 améthystes III + 1 améthyste I = autel tier I).
#   L'autel doit être relié à un tank magique avec la baguette de liaison
#   (clic sur la table d'enchantement puis sur le tank). Chaque rituel consomme du
#   fluide d'un tier au moins égal au tier du rituel, prélevé au lancement
#   (perdu si le rituel échoue). Un rituel peut avoir son propre coût : "fluid: <mB>".
#
#  Chaque rituel demande un tier d'autel minimum ("tier").
#  Plus le tier est haut, plus le rituel est long (tier-duration, ou "duration" pour un rituel précis).
# ==========================================================
config-version: 3

settings:
  altar:
    center: ENCHANTING_TABLE
    pedestal: AMETHYST_BLOCK
    distance: 3
    tier-2-corners: CRYING_OBSIDIAN
    tier-3-base: DIAMOND_BLOCK
  # durée des rituels par tier (secondes)
  tier-duration:
    1: 30
    2: 90
    3: 180
  # grade minimum pour lancer un rituel (RECRUE, MEMBRE, OFFICIER, CHEF)
  rank: MEMBRE
  # le lanceur doit rester à moins de X blocs de l'autel
  interrupt-distance: 8
  # si le rituel est interrompu, les offrandes tombent au sol (sinon elles sont perdues)
  drop-offerings-on-fail: true
  # XP de clan gagnée à la réussite
  clan-xp-reward: 50
  # prévenir les autres clans (nom du clan + direction approximative)
  announce: true
  # autel infusé et fluide magique
  infused:
    require-infused-pedestals: true
    require-link: true
    # mB de fluide consommés par rituel, selon le tier du rituel (fluide de ce tier ou plus)
    fluid-cost:
      1: 2000
      2: 1500
      3: 600

# focus      : objet posé sur la table (matériau Minecraft, ou "windy:<id>" pour un objet personnalisé)
# offerings  : une offrande par bloc d'améthyste (ordre libre) : MATÉRIAU:quantité ou windy:<id>:quantité
# result     : objet obtenu (id de items.yml)
# tier       : tier d'autel minimum
