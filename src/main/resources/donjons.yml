# ==========================================================================================
#  WindyClans - Donjons (v1.2)
# ------------------------------------------------------------------------------------------
#  Un donjon = une instance privée (monde "windy_donjons"), 1 à 5 joueurs, 3 étages.
#  Chaque étage est généré au hasard : salle d'entrée, salles de combat, salle au trésor,
#  puis la salle du gardien d'étage. Les portes s'ouvrent quand la salle est vidée.
#  Le dernier étage se termine par le gardien du donjon et le butin de fin.
#
#  Lancement : menu Boss et donjons > Donjons (grade "rank" minimum), avec un Sceau de donjon
#  dans l'inventaire (consommé au départ). Le clan et ses alliés ont "lobby-seconds" pour rejoindre.
#
#  Monstres à niveau :  PV = base x (1 + hp-per-level x (niveau - 1))
#                       dégâts = base x (1 + damage-per-level x (niveau - 1))
#                       PV x (1 + group-scaling x (joueurs - 1))
#  Butin : "objet min-max chance%"  ex. "windy:eclat_1 2-4 100"  ou  "DIAMOND 1-3 40"
# ==========================================================================================
config-version: 2

settings:
  rank: MEMBRE
  lobby-seconds: 30
  max-players: 5
  # instances en même temps sur le serveur
  max-instances: 3
  # durée max d'une partie (secondes) : 2400 = 40 min
  time-limit: 2400
  # vies partagées par le groupe
  lives: 3
  # un joueur ne reçoit le butin de fin qu'une fois toutes les X secondes (7200 = 2 h)
  reward-cooldown: 7200
  hp-per-level: 0.35
  damage-per-level: 0.2
  group-scaling: 0.6
  # chance qu'un monstre soit une élite (0.125 = 1 sur 8)
  elite-chance: 0.125
  # XP personnelle par monstre tué = niveau du monstre x cette valeur
  xp-per-mob-level: 5
  # salles de combat par étage (+ entrée, trésor et gardien)
  combat-rooms: 4
  # monstres par salle = base + par joueur x joueurs (max "cap")
  mobs-base: 4
  mobs-per-player: 2
  mobs-cap: 14
  # mutation de la semaine : auto (change chaque lundi), none, ou frenesie|elites|colosses|regeneration|explosifs
  mutation: auto
  # chances du butin de fin multipliées pendant une mutation
  mutation-loot-bonus: 1.5
  # groupe ouvert à tous (MAJ 1.21.0) : n'importe qui peut rejoindre, même sans clan ;
  # attente avant le départ (le chef peut partir plus tôt : /donjon partir) et délai entre deux appels "chercher un groupe"
  open-group:
    lobby-seconds: 120
    search-cooldown: 300
  # partie lancée seul (MAJ 1.21.0) : PV et dégâts des monstres, PV des gardiens, vies en plus
  solo:
    health: 0.7
    damage: 0.8
    boss-health: 0.65
    extra-lives: 1
  # bonus de la première victoire du jour, en plus du butin de fin (MAJ 1.21.0)
  first-win:
    coins: 30
    xp: 500
    items: ["windy:eclat_1:2"]

