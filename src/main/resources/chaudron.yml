# ==========================================================================================
#  WindyClans - rituel du chaudron (sacs magiques)
# ==========================================================================================
#  Chaudron runique :
#   tier I  : chaudron rempli d'eau, posé sur un feu de camp allumé,
#             entouré de 4 blocs d'améthyste collés (nord, sud, est, ouest).
#   tier II : même chose sur un feu de camp des âmes allumé,
#             + 4 obsidiennes pleureuses aux 4 coins.
#  Quand tout est en place, le chaudron s'éveille (nouvelle apparence).
#
#  1. Jette les ingrédients dans le chaudron (touche Q au-dessus).
#  2. Quand tout y est, la potion bout : reste à côté jusqu'à la fin.
#  Clic droit sur le chaudron (main vide) : relancer la vérification.
#  Accroupi + clic droit (main vide) : récupérer les ingrédients.
#
#  ingrédients : "MATERIAU:quantité" ou "windy:objet:quantité"
#  base : objet à améliorer (le contenu du sac est gardé)
#  player-level : niveau personnel minimum   clan-level : niveau de clan minimum
# ==========================================================================================
config-version: 6

settings:
  # distance max entre le joueur et le chaudron pendant la cuisson
  stay-radius: 6

