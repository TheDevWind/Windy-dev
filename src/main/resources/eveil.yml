# ==========================================================================================
#  WindyClans - Rituel d'Éveil (passage au rang de race suivant)
# ------------------------------------------------------------------------------------------
#  Sanctuaire d'Éveil (le cœur est un bloc de magnétite / LODESTONE) :
#   rang II  : 4 piliers de 2 briques de tuf sculptées à 3 blocs du cœur (N, S, E, O)
#   rang III : + 4 piliers de 2 briques de tuf sculptées en diagonale (2, 2) surmontés d'un bloc d'or
#   rang IV  : + un bloc de diamant au sommet des 4 piliers N, S, E, O
#   rang V   : + un bloc de netherite sous le cœur et 4 obsidiennes pleureuses collées au cœur
#  On jette les offrandes sur le cœur. Quand tout y est (niveau, âmes, offrandes), l'Éveil commence.
#  Phases : vagues de monstres (60 % du temps), puis Sommeil d'Éveil (le joueur est immobilisé).
#
#  SANCTUAIRE INFUSÉ (MAJ 1.9.0)
#   Le cœur doit être une MAGNÉTITE INFUSÉE (infuseur magique, clic droit avec une magnétite),
#   sinon le sanctuaire n'est pas reconnu. Son tier limite le rang : I -> rang III max,
#   II -> rang IV, III -> rang V. Le cœur doit être relié à un tank magique (baguette de liaison).
#   Chaque Éveil consomme du fluide ("fluid" mB, de tier "fluid-tier" ou plus) au lancement.
# ==========================================================================================
config-version: 3

settings:
  stay-radius: 25          # le joueur doit rester à cette distance du cœur (MAJ 1.22.0 : 10 -> 25)
  pvp-radius: 45           # PvP forcé autour d'un Éveil en cours (même en capitale)
  fail-cooldown-hours: 24
  fail-loss: 0.5           # part des offrandes et des âmes perdue en cas d'échec
  wave-every: 30           # secondes entre deux vagues
  broadcast-precision: 50  # position annoncée arrondie à X blocs
  infused:
    require-infused-core: true
    require-link: true
  # récompense du clan qui interrompt un Éveil (multipliée par le rang visé - 1)
  # MAJ 1.21.0 : divisée par 5 (rang V visé : 200 coins et 160 XP de clan au maximum)
  # Rien n'est donné si le joueur qui interrompt est du clan du rituelliste ou de ses alliés.
  interrupt-reward:
    coins: 50
    clan-xp: 40
  # interruptions par d'autres joueurs (rituelliste tué, cœur ou sanctuaire brisé) avant que
  # les tentatives suivantes du même Éveil se déroulent sans PvP (0 = aucune limite).
  # Sans PvP : personne ne frappe le rituelliste ni ne brise son sanctuaire, et lui ne frappe personne.
  # Un échec dû aux monstres, à un éloignement ou à une déconnexion ne compte pas.
  # Le compteur est propre à chaque Éveil et repart de zéro quand l'Éveil réussit.
  interrupt-limit:
    2: 3
    3: 5
    4: 15
    5: 0

