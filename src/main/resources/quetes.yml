# ==========================================================================================
#  WindyClans - Quêtes du jour et de la semaine, parcours des nouveaux (MAJ 1.21.0)
# ------------------------------------------------------------------------------------------
#  Chaque joueur reçoit chaque jour 3 quêtes (une facile, une moyenne, une difficile) et
#  chaque lundi 3 quêtes de la semaine. Menu : /quetes (ou Profil > Quêtes).
#  Une quête du jour peut être changée une fois par jour (clic sur la quête dans le menu).
#  La récompense est donnée dès que la quête est finie.
#
#  Types d'objectifs (type) et cibles possibles (target, facultatif, séparées par des virgules) :
#   KILL_MOB  tuer des monstres          target : ZOMBIE, SKELETON, CREEPER, BLAZE...
#   MINE      miner des minerais         target : DIAMOND_ORE, IRON_ORE... (la version DEEPSLATE_ compte aussi)
#   CHOP      couper des bûches          target : OAK_LOG, BIRCH_LOG...
#   HARVEST   récolter des cultures mûres target : WHEAT, CARROTS, POTATOES, MELON, PUMPKIN...
#   FISH      pêcher
#   BREED     faire se reproduire des animaux
#   ENCHANT   enchanter un objet (table d'enchantement)
#   PLAY      jouer X minutes (sans être AFK)
#   SOULS     récolter X âmes
#   RITUAL    réussir un rituel d'autel
#   BOSS      vaincre un boss de clan
#   DUNGEON   terminer un donjon
#   RIFT      réussir le rituel d'une Faille arcanique
#   EVENT     participer à l'évènement de la semaine
#  Les blocs posés par un joueur, la pierre de minerai cassée avec Toucher de soie et les
#  monstres de spawner ne comptent pas.
#
#  niveau-min : niveau personnel minimum pour que la quête puisse être tirée.
#  reward : coins, xp, ames, xp-clan, items ("windy:eclat_1:2", "DIAMOND:1-3", "@0.5" = 50 % de chance)
# ==========================================================================================
config-version: 1

settings:
  enabled: true
  # fuseau horaire du changement de jour (minuit) et de semaine (lundi minuit)
  timezone: "Europe/Paris"
  # changements de quête du jour autorisés par jour
  rerolls-per-day: 1
  # points du classement de la semaine pour chaque quête finie
  points:
    facile: 1
    moyenne: 2
    difficile: 3
    semaine: 5

# Série : toutes les quêtes du jour finies plusieurs jours de suite.
# Au-delà du dernier palier, sa récompense revient à chaque multiple (14, 21, 28 jours...).
streak:
  3:
    coins: 25
    xp: 300
  7:
    coins: 60
    xp: 800
    items: ["windy:eclat_1:3"]

# Classement de la semaine : le joueur qui a le plus de points le dimanche soir devient
# Champion de la semaine suivante (titre dans le chat) et reçoit la récompense.
champion:
  title: "&6✦ Champion &r"
  reward:
    coins: 150
    items: ["windy:eclat_2:2", "windy:sceau_donjon_1:1"]
  discord: true

