# ------------------------------------------------------------------------------------------
#  Parcours des nouveaux : étapes guidées, récompensées une fois. Une barre en haut de
#  l'écran indique l'étape suivante (masquable : /parcours masquer).
#  Pour les joueurs déjà là avant la MAJ, les étapes déjà faites sont validées sans récompense.
# ------------------------------------------------------------------------------------------
journey:
  enabled: true
  # la barre ne s'affiche que pendant les X premières heures de jeu
  bar-hours: 12
  steps:
    race:
      name: "Choisir ta race"
      help: "/races : chaque race a ses bonus."
      reward: {coins: 10, xp: 100}
    clan:
      name: "Rejoindre ou créer un clan"
      help: "/clan : crée le tien ou accepte une invitation."
      reward: {coins: 15, xp: 150}
    home:
      name: "Placer ton home"
      help: "/sethome là où tu t'installes."
      reward: {coins: 10, xp: 100}
    quete:
      name: "Finir une quête"
      help: "/quetes : 3 quêtes par jour, 3 par semaine."
      reward: {coins: 10, xp: 150}
    niveau:
      name: "Atteindre le niveau 5"
      level: 5
      help: "Combat, métiers, rituels et temps de jeu."
      reward: {coins: 20, xp: 0}
    boss:
      name: "Vaincre un boss de clan"
      help: "Menu du clan > Boss et donjons."
      reward: {coins: 30, xp: 500}
    donjon:
      name: "Terminer un donjon"
      help: "/donjon : seul, avec ton clan ou un groupe ouvert."
      reward: {coins: 40, xp: 800, items: ["windy:eclat_1:3"]}
  # récompense quand toutes les étapes sont faites
  complete:
    coins: 60
    items: ["windy:sceau_donjon_1:1"]
